name: secuway-windows-portable

on:
  workflow_dispatch:
    inputs:
      validate_checked_in_bundle:
        description: Validate dist/windows-<arch> with secuway doctor
        type: boolean
        default: false
  pull_request:
    paths:
      - "tools/secuway-native/portable/**"
      - "tools/secuway-native/experiments/windows-ci/**"
  push:
    paths:
      - "tools/secuway-native/portable/**"
      - "tools/secuway-native/experiments/windows-ci/**"

permissions:
  contents: read

jobs:
  native-windows:
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: amd64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: tools/secuway-native/portable/go.mod
          cache-dependency-path: tools/secuway-native/portable/go.sum

      - name: Parse Windows PowerShell entry points
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem ./tools/secuway-native/experiments/windows-ci/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error $_.Message }
            }
          }
          if ($failed) { exit 1 }

      - name: Native build, tests, DPAPI round trip, and status contract
        shell: pwsh
        run: >
          ./tools/secuway-native/experiments/windows-ci/Test-Windows.ps1
          -Phase Portable
          -ExpectedArch ${{ matrix.arch }}

      - name: Checked-in bundle doctor
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.validate_checked_in_bundle }}
        shell: pwsh
        run: >
          ./tools/secuway-native/experiments/windows-ci/Test-Windows.ps1
          -Phase Doctor
          -ExpectedArch ${{ matrix.arch }}
          -BundleRoot ./tools/secuway-native/dist/windows-${{ matrix.arch }}

      - name: Upload architecture-checked CLI
        uses: actions/upload-artifact@v4
        with:
          name: secuway-windows-${{ matrix.arch }}-cli
          path: tools/secuway-native/build/windows-ci/${{ matrix.arch }}/secuway.exe
          if-no-files-found: error
          retention-days: 7
