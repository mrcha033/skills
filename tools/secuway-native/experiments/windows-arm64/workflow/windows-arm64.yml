name: Windows ARM64 LEA provider

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/secuway-native/src/lea_provider.cpp"
      - "tools/secuway-native/tests/provider_smoke.c"
      - "tools/secuway-native/experiments/windows-arm64/**"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-11-arm
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Configure ARM64-targeting MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: amd64_arm64

      - name: Build against OpenVPN's pinned OpenSSL and run native tests
        shell: pwsh
        run: ./tools/secuway-native/experiments/windows-arm64/ci/build-and-test.ps1

      - name: Upload validated provider
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: secuway-lea-windows-arm64
          path: tools/secuway-native/experiments/windows-arm64/dist-ci/*
          if-no-files-found: error
