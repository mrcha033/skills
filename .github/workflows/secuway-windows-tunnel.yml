name: secuway-windows-tunnel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tunnel-smoke:
    # This job is intentionally unavailable on public hosted runners. It needs
    # a separately approved Windows host with campus reachability and a
    # pre-enrolled profile; credentials never enter Actions inputs or secrets.
    runs-on: [self-hosted, windows, secuway-tunnel]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 10
    environment: secuway-tunnel

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Interactive Service and tunnel smoke
        shell: pwsh
        run: >
          ./tools/secuway-native/experiments/windows-ci/Invoke-InteractiveServiceSmoke.ps1
          -Mode Tunnel
          -ConfigPath $env:SECUWAY_TUNNEL_CONFIG
          -ProbeHost $env:SECUWAY_TUNNEL_PROBE_HOST
          -ProbePort ([int]$env:SECUWAY_TUNNEL_PROBE_PORT)
          -RequireNonAdmin
