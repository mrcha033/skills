name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate skill metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          for skill in Path("skills").iterdir():
              text = (skill / "SKILL.md").read_text()
              assert text.startswith("---\n")
              assert f"name: {skill.name}\n" in text
          PY
      - name: Validate distribution catalog synchronization
        run: python -B scripts/sync_distribution.py --check
      - name: Run deterministic calculator self-test
        run: python -B skills/quant-stock-technical/scripts/analyze_stock.py --self-test
      - name: Run first-hour research calculator self-test
        run: python -B skills/quant-stock-technical/scripts/analyze_stock_v2.py --self-test
      - name: Run read-only opening-hour collector self-test
        run: python -B skills/quant-stock-technical/scripts/collect_open1h_research.py --self-test
      - name: Run opening-hour evaluator self-test
        run: python -B skills/quant-stock-technical/scripts/evaluate_open1h_research.py --self-test
      - name: Run four-exchange universe builder self-test
        run: python -B skills/quant-stock-technical/scripts/build_universe_manifest.py --self-test
      - name: Run deterministic universe screen self-test
        run: python -B skills/quant-stock-technical/scripts/screen_universe.py --self-test
      - name: Run KIS Korea EOD collector self-test
        run: python -B skills/quant-stock-technical/scripts/fetch_kis_kr_eod.py --self-test
      - name: Run KIS U.S. EOD collector self-test
        run: python -B skills/quant-stock-technical/scripts/fetch_kis_us_eod.py --self-test
      - name: Run account snapshot collector self-test
        run: python -B skills/quant-stock-polling-trader/scripts/account_snapshot.py self-test
      - name: Run official market calendar self-test
        run: python -B skills/quant-stock-polling-trader/scripts/market_calendar.py self-test
      - name: Run recurring daily pipeline self-test
        run: python -B skills/quant-stock-polling-trader/scripts/daily_pipeline.py self-test
      - name: Run strategy-position lifecycle self-test
        run: python -B skills/quant-stock-polling-trader/scripts/position_lifecycle.py --self-test
      - name: Run systemd generator self-test
        run: python -B skills/quant-stock-polling-trader/scripts/systemd_units.py self-test
      - name: Run mandatory handoff-gate self-test
        run: python -B skills/stock-scenario-story/scripts/validate_quant_handoff.py --self-test
      - name: Run numbers-free story gate self-test
        run: python -B skills/stock-scenario-story/scripts/validate_story_text.py --self-test
      - name: Run advisor context-packet self-test
        run: python -B skills/advisor-review/scripts/build_context_packet.py --self-test
      - name: Run advisor advice-schema self-test
        run: python -B skills/advisor-review/scripts/validate_advice.py --self-test
      - name: Run isolated advisor-runner self-test
        run: python -B skills/advisor-review/scripts/run_advisor.py --self-test
      - name: Run advisor parent-decision gate self-test
        run: python -B skills/advisor-review/scripts/validate_decision.py --self-test
      - name: Run advisor behavior-gate self-test
        run: python -B skills/advisor-review/scripts/evaluate_advisor_behavior.py --self-test
      - name: Validate lightweight agent finish-line
        run: python -B tests/test_agent_finish_line.py
      - name: Run LearnUs snapshot self-test
        run: python -B skills/learnus-course-copilot/scripts/self_test.py
      - name: Run Kakao reply-reuse self-test
        run: python -B skills/katok-reply-reuse/scripts/rank_replies.py --self-test
      - name: Run Yonsei governance counsel self-test
        run: python -B skills/yonsei-central-student-governance-counsel/scripts/self_test.py
      - name: Run paired-skill integration test
        run: python -B tests/test_handoff_integration.py
      - name: Run advisor integration test
        run: python -B tests/test_advisor_review.py
      - name: Run universe builder regression
        run: python -B tests/test_universe_builder.py
      - name: Run four-exchange screen contract regression
        run: python -B tests/test_screen_universe.py
      - name: Run screening and execution regression
        run: python -B tests/test_quant_execution.py
      - name: Run QTA2 execution and market-regime regression
        run: |
          python -B tests/test_qta2_execution.py
          python -B tests/test_qta2_market_regime.py
      - name: Run strategy-position ledger regression
        run: python -B tests/test_position_lifecycle.py
      - name: Run systemd unit generator regression
        run: python -B tests/test_systemd_units.py
      - name: Run KIS U.S. EOD regression
        run: python -B tests/test_kis_us_eod.py
      - name: Run KIS Korea EOD regression
        run: python -B tests/test_kis_kr_eod.py
      - name: Run official market calendar regression
        run: python -B tests/test_market_calendar.py
      - name: Run recurring daily pipeline regression
        run: python -B tests/test_daily_pipeline.py
      - name: Validate marketplace packaging
        run: python -B tests/test_marketplace_packaging.py
      - name: Validate deterministic release packaging
        run: python -B tests/test_release_packaging.py
      - name: Build multi-surface release packages
        run: python -B scripts/build_release_packages.py --output-dir dist
      - name: Upload package preview
        uses: actions/upload-artifact@v4
        with:
          name: mrcha-skills-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
