name: secuway-windows-arm64-provider

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/secuway-native/src/lea_provider.cpp"
      - "tools/secuway-native/tests/provider_smoke.c"
      - "tools/secuway-native/experiments/windows-arm64/**"
      - "skills/secuway-vpn/assets/**"
      - ".github/workflows/secuway-windows-arm64-provider.yml"
  push:
    paths:
      - "tools/secuway-native/src/lea_provider.cpp"
      - "tools/secuway-native/tests/provider_smoke.c"
      - "tools/secuway-native/experiments/windows-arm64/**"
      - "skills/secuway-vpn/assets/**"
      - ".github/workflows/secuway-windows-arm64-provider.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-11-arm
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure ARM64-targeting MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: amd64_arm64

      - name: Build against OpenVPN's pinned OpenSSL and run native tests
        shell: pwsh
        run: ./tools/secuway-native/experiments/windows-arm64/ci/build-and-test.ps1

      - name: Upload validated provider
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: secuway-lea-windows-arm64
          path: tools/secuway-native/experiments/windows-arm64/dist-ci/*
          if-no-files-found: error
          retention-days: 7
